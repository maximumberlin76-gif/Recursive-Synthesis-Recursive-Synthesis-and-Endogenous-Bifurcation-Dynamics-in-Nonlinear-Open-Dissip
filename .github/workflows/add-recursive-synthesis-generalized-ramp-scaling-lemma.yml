name: Add Recursive Synthesis Generalized Ramp-Scaling Lemma

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-recursive-synthesis-generalized-ramp-scaling-lemma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add-generalized-ramp-scaling-lemma:
    name: Add and integrate generalized ramp-scaling lemma
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      WORKFLOW_PATH: .github/workflows/add-recursive-synthesis-generalized-ramp-scaling-lemma.yml

    steps:
