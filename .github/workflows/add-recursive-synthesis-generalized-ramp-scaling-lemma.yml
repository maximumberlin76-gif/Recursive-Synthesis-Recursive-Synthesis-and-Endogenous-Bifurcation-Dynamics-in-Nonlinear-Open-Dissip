              "appendix_mathematics_of_dynamics/scaling_and_criticality.md": " M",
              "appendix_resonance_window_dynamics/resonance_window_compression_near_criticality.md": " M",
              "definitions/README.md": " M",
              "operational_interpretation/README.md": " M",
              "release_notes/README.md": " M",
              "repo_map/README.md": " M",
              "theorem_layer/README.md": " M",
          }

          actual: dict[str, str] = {}

          output = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          for line in output:
              if " -> " in line[3:]:
                  raise SystemExit(
                      f"Unexpected rename in boundary: {line}"
                  )

              actual[line[3:]] = line[:2]

          if actual != expected:
              raise SystemExit(
                  "Changed-file boundary mismatch.\n"
                  f"Expected: {expected}\n"
                  f"Actual: {actual}"
              )

          print(
              f"Exact changed-file boundary PASS: "
              f"{len(expected)} paths."
          )
          PY

          git diff --check
          git diff --stat

