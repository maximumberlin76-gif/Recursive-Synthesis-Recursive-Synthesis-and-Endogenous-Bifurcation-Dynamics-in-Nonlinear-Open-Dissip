      - name: Validate YAML CFF and internal Markdown links
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path
          from urllib.parse import unquote

          import yaml

          yaml_files = sorted(
              set(Path(".").rglob("*.yml"))
              | set(Path(".").rglob("*.yaml"))
              | set(Path(".").rglob("*.cff"))
          )
          for path in yaml_files:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)

          link_pattern = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          violations: list[str] = []
          checked = 0

          for document in sorted(Path(".").rglob("*.md")):
              text = document.read_text(encoding="utf-8")
              for match in link_pattern.finditer(text):
                  raw = match.group(1).strip()
                  if raw.startswith("<") and raw.endswith(">"):
                      raw = raw[1:-1]

                  destination = raw.split()[0]
                  if not destination or destination.startswith(
                      ("#", "http://", "https://", "mailto:", "data:")
                  ):
                      continue

                  destination = unquote(destination.split("#", 1)[0])
                  if not destination:
                      continue

                  checked += 1
                  target = (document.parent / destination).resolve()

                  if not target.exists():
                      line = text.count("\n", 0, match.start()) + 1
                      violations.append(
                          f"{document}:{line} -> {destination}"
                      )

          if violations:
              raise SystemExit(
                  "Broken internal Markdown links:\n"
                  + "\n".join(violations)
              )

          print(
              f"YAML/CFF PASS: {len(yaml_files)} files; "
              f"internal Markdown links PASS: {checked} links."
          )
          PY

      - name: Verify archive CRC and manifest state
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import tarfile
          import zipfile
          from pathlib import Path

          archives: list[Path] = []

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue

              if path.name.lower().endswith(
                  (
                      ".zip",
                      ".tar",
                      ".tar.gz",
                      ".tgz",
                      ".tar.bz2",
                      ".tbz2",
                      ".tar.xz",
                      ".txz",
                  )
              ):
                  archives.append(path)

          for path in archives:
              if path.name.lower().endswith(".zip"):
                  with zipfile.ZipFile(path) as archive:
                      bad = archive.testzip()

                      if bad is not None:
                          raise SystemExit(
                              f"ZIP CRC failure in {path}: {bad}"
                          )
              else:
                  with tarfile.open(path, "r:*") as archive:
                      for member in archive.getmembers():
                          if not member.isfile():
                              continue

                          extracted = archive.extractfile(member)

                          if extracted is None:
                              raise SystemExit(
                                  f"Cannot read TAR member "
                                  f"{member.name} in {path}"
                              )

                          while extracted.read(1024 * 1024):
                              pass

          manifests = [
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and (
                  "sha256" in path.name.lower()
                  or "checksum" in path.name.lower()
              )
          ]

          print(
              f"Archive validation PASS: {len(archives)} archives; "
              f"{len(manifests)} checksum-manifest candidates."
          )
          PY

