                  continue
              if path.name.lower().endswith(
                  ('.zip', '.tar', '.tar.gz', '.tgz', '.tar.bz2', '.tbz2', '.tar.xz', '.txz')
              ):
                  archives.append(path)

          for path in archives:
              if path.name.lower().endswith('.zip'):
                  with zipfile.ZipFile(path) as archive:
                      bad = archive.testzip()
                      if bad is not None:
                          raise SystemExit(f'ZIP CRC failure in {path}: {bad}')
              else:
                  with tarfile.open(path, 'r:*') as archive:
                      for member in archive.getmembers():
                          if not member.isfile():
                              continue
                          extracted = archive.extractfile(member)
                          if extracted is None:
                              raise SystemExit(f'Cannot read TAR member {member.name} in {path}')
                          while extracted.read(1024 * 1024):
                              pass

          manifests = [
              path for path in Path('.').rglob('*')
              if path.is_file()
              and '.git' not in path.parts
              and ('sha256' in path.name.lower() or 'checksum' in path.name.lower())
          ]
          print(f'Archive validation PASS: {len(archives)} archives; {len(manifests)} checksum-manifest candidates.')
          PY

