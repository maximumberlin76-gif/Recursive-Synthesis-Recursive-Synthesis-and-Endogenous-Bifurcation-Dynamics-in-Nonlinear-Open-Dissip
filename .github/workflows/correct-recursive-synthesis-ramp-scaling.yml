      - name: Validate YAML CFF and internal Markdown links
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path
          from urllib.parse import unquote

          import yaml

          yaml_files = sorted(
              set(Path('.').rglob('*.yml'))
              | set(Path('.').rglob('*.yaml'))
              | set(Path('.').rglob('*.cff'))
          )
          for path in yaml_files:
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)

          link_pattern = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          violations: list[str] = []
          checked = 0
          for document in sorted(Path('.').rglob('*.md')):
              text = document.read_text(encoding='utf-8')
              for match in link_pattern.finditer(text):
                  raw = match.group(1).strip()
                  if raw.startswith('<') and raw.endswith('>'):
                      raw = raw[1:-1]
                  destination = raw.split()[0]
                  if not destination or destination.startswith(('#', 'http://', 'https://', 'mailto:', 'data:')):
                      continue
                  destination = unquote(destination.split('#', 1)[0])
                  if not destination:
                      continue
                  checked += 1
                  target = (document.parent / destination).resolve()
                  if not target.exists():
                      line = text.count('\n', 0, match.start()) + 1
                      violations.append(f'{document}:{line} -> {destination}')
          if violations:
              raise SystemExit('Broken internal Markdown links:\n' + '\n'.join(violations))
          print(f'YAML/CFF PASS: {len(yaml_files)} files; internal Markdown links PASS: {checked} links.')
          PY

