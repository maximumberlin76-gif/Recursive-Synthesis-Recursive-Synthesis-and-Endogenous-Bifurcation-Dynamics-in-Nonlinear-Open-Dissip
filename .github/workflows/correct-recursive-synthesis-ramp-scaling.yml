name: Correct Recursive Synthesis Ramp Scaling

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-recursive-synthesis-ramp-scaling-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct-ramp-scaling:
    name: Correct critical ramp temporal and amplitude scaling
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      WORKFLOW_PATH: .github/workflows/correct-recursive-synthesis-ramp-scaling.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependency
