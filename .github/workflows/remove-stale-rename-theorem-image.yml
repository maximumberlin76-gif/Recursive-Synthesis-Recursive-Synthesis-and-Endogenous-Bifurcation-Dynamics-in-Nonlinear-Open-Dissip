name: Remove Stale Theorem Image Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-stale-theorem-image-workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remove-stale-workflow:
    name: Remove obsolete theorem image rename workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      STALE_WORKFLOW_PATH: .github/workflows/rename-theorem-image.yml
      CURRENT_WORKFLOW_PATH: .github/workflows/remove-stale-rename-theorem-image.yml
      TARGET_IMAGE_PATH: assets/recursive_synthesis_endogenous_bifurcation_dynamics_theorem_EN.png

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact cleanup source state
        shell: bash
        run: |
          set -euo pipefail

          expected_stale_sha256="e4e0c5829932f44db0cdc29efc46f09d6a5665015e6f392fc20966ec7777552c"
          expected_image_sha256="04d4e493273c899eb547f13b047c9d4e859966e54b4fab5550b611ca57dc306c"

          test -f "${STALE_WORKFLOW_PATH}"
          test -f "${CURRENT_WORKFLOW_PATH}"
          test -f "${TARGET_IMAGE_PATH}"

          actual_stale_sha256="$(
            sha256sum "${STALE_WORKFLOW_PATH}" |
            awk '{print $1}'
          )"

          actual_image_sha256="$(
            sha256sum "${TARGET_IMAGE_PATH}" |
            awk '{print $1}'
          )"

          if [[ "${actual_stale_sha256}" != "${expected_stale_sha256}" ]]; then
            echo "Source-state mismatch for ${STALE_WORKFLOW_PATH}"
            echo "Expected: ${expected_stale_sha256}"
            echo "Actual:   ${actual_stale_sha256}"
            exit 1
          fi

          if [[ "${actual_image_sha256}" != "${expected_image_sha256}" ]]; then
            echo "Source-state mismatch for ${TARGET_IMAGE_PATH}"
            echo "Expected: ${expected_image_sha256}"
            echo "Actual:   ${actual_image_sha256}"
            exit 1
          fi

          mime_type="$(
            file --brief --mime-type "${TARGET_IMAGE_PATH}"
          )"

          if [[ "${mime_type}" != "image/png" ]]; then
            echo "Expected image/png, detected ${mime_type}"
            exit 1
          fi

          mapfile -t legacy_candidates < <(
            find assets \
              -maxdepth 1 \
              -type f \
              -name 'file_*' \
              -print |
            sort
          )

          if [[ "${#legacy_candidates[@]}" -ne 0 ]]; then
            echo "Unexpected legacy file_* image candidates remain:"
            printf '%s\n' "${legacy_candidates[@]}"
            exit 1
          fi

          if [[ -e assets/.gitkeep ]]; then
            echo "Unexpected stale assets/.gitkeep remains."
            exit 1
          fi

          mapfile -t workflow_files < <(
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              -printf '%p\n' |
            sort
          )

          expected_workflows=(
            "${CURRENT_WORKFLOW_PATH}"
            "${STALE_WORKFLOW_PATH}"
          )

          mapfile -t expected_workflows < <(
            printf '%s\n' "${expected_workflows[@]}" |
            sort
          )

          if [[ "${workflow_files[*]}" != "${expected_workflows[*]}" ]]; then
            echo "Unexpected workflow boundary before cleanup."
            echo "Actual workflows:"
            printf '%s\n' "${workflow_files[@]}"
            echo "Expected workflows:"
            printf '%s\n' "${expected_workflows[@]}"
            exit 1
          fi

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "Checkout is not clean before cleanup:"
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi

          echo "Exact cleanup source state verified."

      - name: Remove stale workflow and this one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          rm -- "${STALE_WORKFLOW_PATH}"
          rm -- "${CURRENT_WORKFLOW_PATH}"

          test ! -e "${STALE_WORKFLOW_PATH}"
          test ! -e "${CURRENT_WORKFLOW_PATH}"
          test -f "${TARGET_IMAGE_PATH}"

      - name: Verify exact changed-file boundary
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from __future__ import annotations

          import subprocess


          expected = {
              ".github/workflows/remove-stale-rename-theorem-image.yml": " D",
              ".github/workflows/rename-theorem-image.yml": " D",
          }

          output = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          actual: dict[str, str] = {}

          for line in output:
              status = line[:2]
              path = line[3:]

              if " -> " in path:
                  raise SystemExit(
                      f"Unexpected rename in cleanup boundary: {line}"
                  )

              actual[path] = status

          if actual != expected:
              raise SystemExit(
                  "Changed-file boundary mismatch.\n"
                  f"Expected: {expected}\n"
                  f"Actual:   {actual}"
              )

          print(
              "Exact changed-file boundary PASS: "
              "2 deleted workflows."
          )
          PY

          git diff --check
          git diff --stat

      - name: Commit and push workflow cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            "${STALE_WORKFLOW_PATH}" \
            "${CURRENT_WORKFLOW_PATH}"

          git diff --cached --check

          git commit \
            -m "Remove stale theorem image workflow" \
            -m "Remove the obsolete theorem-image rename workflow after verifying the final PNG path, MIME type, exact SHA-256, absence of legacy file_* candidates, and the exact two-file deletion boundary. Remove this one-time cleanup workflow in the same atomic commit."

          git push origin "HEAD:${GITHUB_REF_NAME}"
